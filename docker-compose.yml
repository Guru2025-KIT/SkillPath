version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: skillpath-backend
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8000
    container_name: skillpath-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped